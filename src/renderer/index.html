<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbe</title>
  </head>
  <body>
    <div id="raiz" class="colapsado ancla-derecha ancla-abajo">
      <section id="panel" class="panel" aria-label="Chat del asistente" aria-hidden="true">
        <div id="fondo" class="panel-fondo" aria-hidden="true"></div>
        <header id="panel-cabecera" class="panel-cabecera">
          <div class="cabecera-titulo">
            <span class="panel-titulo">Orbe</span>
            <span id="modelo" class="chip-modelo" hidden></span>
          </div>
          <div class="cabecera-acciones">
            <button id="potencia-boton" class="boton-icono boton-potencia" type="button" title="Potencia del modelo" aria-label="Potencia del modelo" aria-expanded="false" data-nivel="medium">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.34 19a10 10 0 1 1 17.32 0" />
                <path class="aguja" d="M12 14V6.5" />
              </svg>
            </button>
            <button id="voz-boton" class="boton-icono" type="button" title="Voz y dictado" aria-label="Voz y dictado" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H2v6h4l5 4V5z" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>
            </button>
            <button id="fondo-boton" class="boton-icono" type="button" title="Fondo del chat" aria-label="Fondo del chat" aria-expanded="false" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
                <path d="M9 10.5h.01" />
                <path d="m21 16-5-5-9 9" />
              </svg>
            </button>
            <button id="memoria-boton" class="boton-icono" type="button" title="Memoria: lo que Orbe sabe de ti" aria-label="Memoria" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
              </svg>
            </button>
            <button id="ajustes-boton" class="boton-icono" type="button" title="Configuración: IA, claves, dictado y voz" aria-label="Configuración" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 4h-7" />
                <path d="M10 4H3" />
                <path d="M21 12h-9" />
                <path d="M8 12H3" />
                <path d="M21 20h-5" />
                <path d="M12 20H3" />
                <path d="M14 2v4" />
                <path d="M8 10v4" />
                <path d="M16 18v4" />
              </svg>
            </button>
            <button id="nueva" class="boton-icono" type="button" title="Nueva conversación" aria-label="Nueva conversación">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" />
              </svg>
            </button>
            <button id="fijar-boton" class="boton-icono" type="button" title="Fijado: el panel se queda por encima de las demás ventanas" aria-label="Fijar el panel por encima de las demás ventanas" aria-pressed="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 17v5" />
                <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
              </svg>
            </button>
            <button id="cerrar-boton" class="boton-icono" type="button" title="Cerrar el panel (Orbe sigue en la esquina)" aria-label="Cerrar el panel">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        </header>

        <div class="panel-cuerpo">
          <div id="mensajes" class="mensajes" role="log" aria-live="polite" aria-label="Conversación">
            <div id="vacio" class="vacio">
              <p class="vacio-titulo">¿En qué te ayudo?</p>
              <p class="vacio-ayuda">Escribe tu pregunta abajo.<br />Pulsa <kbd>Ctrl</kbd> <kbd>Mayús</kbd> <kbd>Espacio</kbd> para abrir o cerrar el panel.</p>
            </div>
          </div>

          <div id="pendiente" class="pendiente" aria-label="Contexto de pantalla que se enviará" hidden></div>

          <div id="confirmacion" class="confirmacion" role="alertdialog" aria-label="Confirmar la captura de pantalla" hidden></div>

          <div id="sugerencia" class="sugerencia" role="status" hidden></div>

          <div id="estado-linea" class="estado-linea" role="status" hidden></div>

          <button id="detener-accion" class="detener-accion" type="button" title="Detener la tarea ahora mismo (Esc)" hidden>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2.5" />
            </svg>
            Detener la tarea
          </button>

          <form id="compositor" class="compositor" autocomplete="off">
            <button
              id="leer"
              class="boton-leer"
              type="button"
              title="Leer la pantalla y adjuntarla a tu próximo mensaje (Ctrl+Mayús+Alt+Espacio)"
              aria-label="Leer la pantalla"
            >
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button
              id="capturar"
              class="boton-leer boton-captura"
              type="button"
              title="Adjuntar una captura de pantalla (último recurso: te pedirá confirmación)"
              aria-label="Adjuntar una captura de pantalla"
            >
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z" />
                <circle cx="12" cy="13" r="3" />
              </svg>
            </button>
            <button
              id="microfono"
              class="boton-leer boton-micro"
              type="button"
              title="Dictar con el micrófono (pulsa para empezar a grabar y otra vez para terminar)"
              aria-label="Dictar con el micrófono"
            >
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <path d="M12 19v3" />
              </svg>
            </button>
            <textarea id="entrada" class="entrada" rows="1" placeholder="Escribe un mensaje…" aria-label="Mensaje" spellcheck="true"></textarea>
            <button id="enviar" class="boton-enviar" type="button" aria-label="Enviar" disabled>
              <svg class="icono-enviar" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5" />
                <path d="m5 12 7-7 7 7" />
              </svg>
              <svg class="icono-detener" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2.5" />
              </svg>
            </button>
          </form>
        </div>

        <section id="memoria" class="memoria" aria-label="Memoria" hidden></section>
        <section id="ajustes" class="memoria ajustes" aria-label="Configuración" hidden></section>

        <div id="fondo-menu" class="fondo-menu" role="dialog" aria-label="Opciones del fondo" hidden></div>
        <div id="voz-menu" class="fondo-menu voz-menu" role="dialog" aria-label="Opciones de voz" hidden></div>
        <div id="potencia-menu" class="fondo-menu potencia-menu" role="dialog" aria-label="Potencia del modelo" hidden></div>

        <!-- Agarres para cambiar el tamaño: están en los bordes libres (los opuestos al orbe, que no se mueve). -->
        <div class="agarre agarre-x" data-modo="x" title="Cambiar el ancho"></div>
        <div class="agarre agarre-y" data-modo="y" title="Cambiar el alto"></div>
        <div class="agarre agarre-xy" data-modo="xy" title="Cambiar el tamaño"></div>
      </section>

      <div id="orbe-caja" class="orbe-caja" title="Clic para abrir o cerrar · arrastra para mover">
        <canvas id="orbe-canvas" class="orbe-canvas"></canvas>
        <button id="detener-orbe" class="detener-orbe" type="button" title="Detener la tarea" aria-label="Detener la tarea" hidden>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2.5" />
          </svg>
        </button>
      </div>

      <div id="depuracion" class="depuracion" hidden></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
