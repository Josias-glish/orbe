name: Publicar instalador

# Se ejecuta al subir una etiqueta de versión (por ejemplo v1.0.0): compila, prueba, genera el instalador
# de Windows y lo adjunta a una release de GitHub.
on:
  push:
    tags: ['v*']
  # También a mano (pestaña Actions → «Publicar instalador» → Run workflow), con la versión de package.json.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      # Paquete de recursos y herramientas: el modelo 3D y sus texturas, el script de los conectores (hooks de Claude
      # Code), el servidor de voz local, la galería, los scripts y la documentación.
      - name: Paquete de herramientas
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $carpeta = "dist/Orbe-herramientas-$v"
          New-Item -ItemType Directory -Force -Path $carpeta | Out-Null
          foreach ($c in @('resources/personaje', 'resources/conectores', 'helper', 'voz-local', 'scripts')) {
            Copy-Item -Recurse -Path $c -Destination (Join-Path $carpeta $c) -Force
          }
          Copy-Item README.md, .env.example -Destination $carpeta
          Compress-Archive -Path "$carpeta/*" -DestinationPath "dist/Orbe-herramientas-$v.zip" -Force
      - name: Crear la release con el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          etiqueta="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then etiqueta="v$(node -p "require('./package.json').version")"; fi
          gh release create "$etiqueta" \
            "dist/Orbe-Setup-"*.exe \
            "dist/Orbe-Setup-"*.exe.blockmap \
            "dist/Orbe-Portable-"*.exe \
            "dist/Orbe-"*"-win.zip" \
            "dist/Orbe-herramientas-"*.zip \
            --target "$GITHUB_SHA" \
            --title "Orbe $etiqueta" \
            --generate-notes
