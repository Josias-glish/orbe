appId: com.orbe.asistente
productName: Orbe
copyright: Orbe
directories:
  output: dist
  buildResources: resources

# Solo lo compilado y las dependencias de producción: nunca el .env, las pruebas ni las capturas.
files:
  - out/**
  - package.json

# Fuera del asar, en los dos sistemas. El lector de pantalla y el icono de la bandeja van en win/mac.
extraResources:
  # El script con el que Claude Code (por sus hooks) y otras herramientas avisan a Orbe.
  - from: resources/conectores
    to: conectores
  # El personaje 3D (el conejo) y su calibración.
  - from: resources/personaje
    to: personaje
  # Fondos del chat incluidos en la instalación (si existe resources/fondos; ver «npm run fondos»).
  - from: resources/fondos
    to: fondos

# Varias formas de tenerlo en Windows (todas x64):
#   - Orbe-Setup-<versión>.exe     instalador clásico: eliges carpeta, accesos directos y desinstalador.
#   - Orbe-Portable-<versión>.exe  un solo .exe que se ejecuta sin instalar nada (ideal para un USB).
#   - Orbe-<versión>-win.zip        la carpeta de la aplicación comprimida: descomprimes y abres Orbe.exe.
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
    - target: zip
      arch: x64
  icon: resources/icon.ico
  # El lector de pantalla y el control del PC (PowerShell + C#) se ejecutan desde disco.
  extraResources:
    - from: helper
      to: helper
      filter:
        - '*.cs'
        - '*.ps1'
    - from: resources/tray.png
      to: tray.png
  artifactName: Orbe-${version}-win.${ext}
  # Sin certificado de firma: Windows SmartScreen avisará de «editor desconocido» al instalar.
  signAndEditExecutable: true

nsis:
  artifactName: Orbe-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Orbe
  deleteAppDataOnUninstall: false
  # Un único nombre de instalador por versión, sin guiones raros.
  uninstallDisplayName: Orbe

portable:
  artifactName: Orbe-Portable-${version}.${ext}
  # Nombre de la carpeta de %TEMP% donde se descomprime al abrirse (tarda unos segundos).
  unpackDirName: Orbe

# macOS (Apple Silicon e Intel por separado): Orbe-<versión>-mac-arm64.dmg / -x64.dmg y sus .zip.
# Sin cuenta de Apple Developer: firma ad hoc («-») y sin notarizar, así que Gatekeeper pide «Abrir igualmente»
# en Ajustes del Sistema → Privacidad y seguridad la primera vez.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icon-mac.png
  category: public.app-category.productivity
  artifactName: Orbe-${version}-mac-${arch}.${ext}
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Como en Windows (sin botón en la barra de tareas): sin icono en el Dock; Orbe vive en la barra de menús.
    LSUIElement: true
    NSMicrophoneUsageDescription: Orbe usa el micrófono solo mientras dictas un mensaje.
  # El ayudante nativo (Accesibilidad, Vision y entrada simulada), compilado con scripts/compilar-helper-mac.sh.
  extraResources:
    - from: helper/mac/orbe-helper
      to: helper/mac/orbe-helper
    - from: resources/tray-mac.png
      to: tray-mac.png
    - from: resources/tray-mac@2x.png
      to: tray-mac@2x.png

dmg:
  artifactName: Orbe-${version}-mac-${arch}.${ext}
